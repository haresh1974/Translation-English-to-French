  const cols = ['#1F46A8', '#D63C3F', '#E8A33D', '#52B788', '#7B68EE', '#C0508A'];
  const ps = Array.from({ length: 130 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(q => { q.x += q.vx; q.y += q.vy; q.r += q.vr; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 3, q.s, q.s * .6); ctx.restore(); });
    if (++f < 170) requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ---------------- events ---------------- */
let lastField = null;
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('[data-ta],[data-ci]')) lastField = e.target; });
document.addEventListener('input', e => {
  const t = e.target, r = st.run;
  if (t.id === 'name') { st.name = t.value; store.set('name', st.name); }
  else if (t.matches('[data-ta]')) r.ans[r.si].text = t.value;
  else if (t.matches('[data-ci]')) r.ans[r.si].chunks[t.dataset.ci] = t.value;
});
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('[data-ta]') && (e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doCheck(); }
  if (e.target.matches && e.target.matches('[data-ci]') && e.key === 'Enter') { e.preventDefault(); const all = [...document.querySelectorAll('[data-ci]')], i = all.indexOf(e.target); if (i < all.length - 1) all[i + 1].focus(); else doCheck(); }
});
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('[data-act="ins"],[data-act="shift"]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, r = st.run;
  Snd.init();
  if (a === 'pick') { st.pid = +t.dataset.id; renderKeep(); }
  else if (a === 'model') { st.model = t.dataset.m; store.set('model', st.model); renderKeep(); }
  else if (a === 'opt') {
    const o = t.dataset.o, v = o === 'read' ? +t.dataset.v : t.dataset.v;
    st[o] = v; store.set(o, v);
    const d = document.querySelector('details.teacher'); const was = d && d.open; render(); const d2 = document.querySelector('details.teacher'); if (d2 && was) d2.open = true;
  }
  else if (a === 'snd') { st.sound = !st.sound; store.set('sound', st.sound); if (st.sound) { Snd.init(); Snd.good(2); } renderKeep(); }
  else if (a === 'start') {
    const p = P.find(x => x.id === st.pid); if (!p) return;
    st.run = newRun(p); st.run.readSecs = st.read; st.quit = false;
    st.view = st.read > 0 ? 'read' : 'play'; render(); window.scrollTo(0, 0);
  }
  else if (a === 'begin') { clearInterval(st.timer); st.view = 'play'; render(); window.scrollTo(0, 0); const f = document.querySelector('[data-ta],[data-ci]'); if (f) f.focus(); }
  else if (a === 'home') { clearInterval(st.timer); st.view = 'home'; st.run = null; st.quit = false; render(); window.scrollTo(0, 0); }
  else if (a === 'quit-ask') { st.quit = true; renderKeep(); }
  else if (a === 'quit-no') { st.quit = false; renderKeep(); }
  else if (a === 'bub') { const A = r.ans[r.si]; A.open[t.dataset.b] = !A.open[t.dataset.b]; saveFields(); renderKeep(); }
  else if (a === 'vh') {
    const A = r.ans[r.si]; if (A.res) return; const b = +t.dataset.b, l = +t.dataset.l;
    A.usage[b] = Math.max(A.usage[b] || 0, l); A.open[b] = true; saveFields(); renderKeep();
  }
  else if (a === 'ins') { insertChar(t.dataset.c); }
  else if (a === 'shift') { st.shift = !st.shift; saveFields(); renderKeep(); }
  else if (a === 'check') { saveFields(); doCheck(); }
  else if (a === 'next') { if (r.si < r.p.sentences.length - 1) { r.si++; render(); window.scrollTo(0, 0); const f = document.querySelector('[data-ta],[data-ci]'); if (f) f.focus(); } else finish(); }
  else if (a === 'goto') { const i = +t.dataset.i; if (r.ans[i].fin || i === r.si) { saveFields(); r.si = i; render(); } }
  else if (a === 'tile') { const A = r.ans[r.si]; if (!A.res) { A.tiles.push(+t.dataset.k); Snd.tick(); renderKeep(); } }
  else if (a === 'untile') { const A = r.ans[r.si]; if (!A.res) { A.tiles.splice(+t.dataset.j, 1); renderKeep(); } }
  else if (a === 'again') { const p = st.run.p; st.run = newRun(p); st.run.readSecs = 0; st.view = 'play'; render(); window.scrollTo(0, 0); }
  else if (a === 'copy') copyResults();
});
function saveFields() { /* values are saved on input already */ }
function insertChar(c) {
  const f = lastField && document.body.contains(lastField) ? lastField : document.querySelector('[data-ta],[data-ci]');
  if (!f || f.disabled) return;
  const s = f.selectionStart == null ? f.value.length : f.selectionStart, en = f.selectionEnd == null ? s : f.selectionEnd;
  f.value = f.value.slice(0, s) + c + f.value.slice(en);
  f.setSelectionRange(s + c.length, s + c.length); f.focus();
  f.dispatchEvent(new Event('input', { bubbles: true }));
}
function copyResults() {
  const text = resultText(summaryData()), slot = $('#copyslot');
  const fallback = () => { slot.innerHTML = '<p class="hint-note" style="margin:8px 0 4px">Select and copy this text:</p><textarea class="copybox" readonly></textarea>'; const ta = slot.querySelector('textarea'); ta.value = text; ta.focus(); ta.select(); };
  try { navigator.clipboard.writeText(text).then(() => toast('Results copied'), fallback); } catch (e) { fallback(); }
}
if (st.pid === null) { /* nothing preselected */ }
render();
window.__st = st; window.__render = render;

</script>
