<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="English to French translation practice with hint bubbles, auto-marking and an answer key.">
<title>French Translation Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: one centred column. Home (name, text, model, teacher options) -> 2-minute reading page -> one sentence per screen -> summary with answer key.
   Palette: French blue ink on cool paper, a red used only as a small signal, and the six hint colours from the Word worksheets. */
:root{
  --bg:#EEF2F9; --surface:#FFFFFF; --surface2:#F5F8FD; --fg:#14213D; --muted:#566379; --line:#D5DDEB;
  --accent:#1F46A8; --on-accent:#FFFFFF; --accent-soft:#E3EBFB; --red:#D63C3F;
  --good:#17784A; --good-t:#DDF3E7; --warn:#946008; --warn-t:#FBEFD2; --bad:#B23B24; --bad-t:#FBE1DA;
  --brk:#4A7FC1; --ctx:#E8A33D; --cog:#52B788; --ff:#E76F51; --grm:#7B68EE; --skl:#C0508A;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 18px rgba(20,33,61,.07);
  --f-head:'Fredoka',system-ui,sans-serif; --f-ui:'Figtree',system-ui,sans-serif; --f-fr:'Newsreader',Georgia,serif;
}
:root{
  --brk-t:color-mix(in srgb,var(--brk) 16%,var(--surface)); --brk-d:color-mix(in srgb,var(--brk) 55%,var(--fg));
  --ctx-t:color-mix(in srgb,var(--ctx) 20%,var(--surface)); --ctx-d:color-mix(in srgb,var(--ctx) 45%,var(--fg));
  --cog-t:color-mix(in srgb,var(--cog) 19%,var(--surface)); --cog-d:color-mix(in srgb,var(--cog) 45%,var(--fg));
  --ff-t:color-mix(in srgb,var(--ff) 16%,var(--surface)); --ff-d:color-mix(in srgb,var(--ff) 55%,var(--fg));
  --grm-t:color-mix(in srgb,var(--grm) 16%,var(--surface)); --grm-d:color-mix(in srgb,var(--grm) 55%,var(--fg));
  --skl-t:color-mix(in srgb,var(--skl) 15%,var(--surface)); --skl-d:color-mix(in srgb,var(--skl) 55%,var(--fg));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#172038; --surface2:#1D2842; --fg:#E9EEFA; --muted:#A5B0C8; --line:#2C3957;
  --accent:#8FB1FF; --on-accent:#0E1424; --accent-soft:#22305A; --red:#FF7B7E;
  --good:#6FD6A3; --good-t:#173A2B; --warn:#F2BD5E; --warn-t:#3E3115; --bad:#FF907A; --bad-t:#43211B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172038; --surface2:#1D2842; --fg:#E9EEFA; --muted:#A5B0C8; --line:#2C3957;
  --accent:#8FB1FF; --on-accent:#0E1424; --accent-soft:#22305A; --red:#FF7B7E;
  --good:#6FD6A3; --good-t:#173A2B; --warn:#F2BD5E; --warn-t:#3E3115; --bad:#FF907A; --bad-t:#43211B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-head);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* category colours */
.c-B{--c:var(--brk);--t:var(--brk-t);--d:var(--brk-d)}.c-C{--c:var(--ctx);--t:var(--ctx-t);--d:var(--ctx-d)}
.c-G{--c:var(--cog);--t:var(--cog-t);--d:var(--cog-d)}.c-F{--c:var(--ff);--t:var(--ff-t);--d:var(--ff-d)}
.c-T{--c:var(--grm);--t:var(--grm-t);--d:var(--grm-d)}.c-S{--c:var(--skl);--t:var(--skl-t);--d:var(--skl-d)}

/* top bar */
.topwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.flag{height:5px;background:linear-gradient(90deg,#1F46A8 0 33.4%,#FFFFFF 33.4% 66.6%,#D63C3F 66.6%);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.top{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none}
.brand b{font-family:var(--f-head);font-weight:600;font-size:18px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:12.5px;display:block;letter-spacing:.02em}
.iconbtn{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.iconbtn[aria-pressed="false"]{opacity:.65}

/* buttons */
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;padding:11px 22px;border-radius:12px;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none}
.btn.big{font-size:18px;padding:14px 30px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{padding:28px 0 6px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(34px,7vw,54px);letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:60ch;font-size:17px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,24px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.step>h2{font-size:21px;display:flex;gap:10px;align-items:center}
.stepn{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:inline-grid;place-items:center;font:600 16px var(--f-head);flex:none}
.namebox{width:100%;max-width:360px;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface2);font-size:17px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tcard{position:relative;text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tcard:hover{border-color:var(--accent)}
.tcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard .em{font-size:26px;line-height:1}
.tcard .no{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tcard .ti{font-family:var(--f-fr);font-size:20px;font-weight:600;line-height:1.2}
.tcard .gl{color:var(--muted);font-size:14px}
.tcard .meta{font-size:13px;color:var(--muted);margin-top:2px}
.tcard .best{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;background:var(--good-t);color:var(--good);padding:2px 8px;border-radius:99px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mcard{text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mcard b{font-family:var(--f-head);font-size:19px;font-weight:600}
.mcard .lv{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.mcard p{font-size:14.5px;color:var(--muted)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.mini i{font-style:normal;font-family:var(--f-fr);font-size:14px;padding:2px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
details.teacher{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:14px 18px}
details.teacher summary{cursor:pointer;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:14px}
.opt h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opt p{font-size:13.5px;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:14px;font-weight:600}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.startbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.startbar span{color:var(--muted);font-size:14.5px}

/* reading */
.pagehead{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;padding-top:20px}
.pagehead h1{font-size:clamp(26px,5vw,38px)}
.pagehead small{display:block;color:var(--muted);font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.readgrid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:start}
@media(max-width:760px){.readgrid{grid-template-columns:1fr}}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px 18px 18px 6px;border-left:6px solid var(--accent);padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
.paper p{font-family:var(--f-fr);font-size:clamp(20px,3.2vw,25px);line-height:1.75;text-wrap:pretty}
.paper .lab{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
mark{background:var(--t);color:inherit;border-bottom:3px solid var(--c);padding:0 3px;border-radius:3px}
mark sup{font:700 11px var(--f-ui);color:var(--d);margin-left:2px}
.timer{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow)}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:600 30px var(--f-head);font-variant-numeric:tabular-nums}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer p{font-size:14px;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.lg{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--c);background:var(--t);border-radius:12px;padding:8px 12px;font-size:14px}
.lg b{display:block;color:var(--d);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.lg i{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c);margin-top:3px}

/* play */
.playhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:16px}
.playhead h2{font-size:22px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.playhead h2 small{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:700 12px var(--f-ui);padding:0}
.dot[aria-current="true"]{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 3px var(--accent-soft)}
.dot.full{background:var(--good);border-color:var(--good);color:var(--surface)}
.dot.part{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.dot.low{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.en{font-family:var(--f-fr);font-size:clamp(23px,4.2vw,32px);line-height:1.6;text-wrap:pretty}
.en .tag{font:700 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:2px 8px;border-radius:6px;margin-right:8px;vertical-align:middle}
.hint-note{font-size:14px;color:var(--muted)}
.bubs{display:flex;flex-direction:column;gap:8px}
.bub{border:2px solid var(--c);background:var(--t);border-radius:14px;overflow:hidden}
.bub-h{width:100%;border:0;background:transparent;display:flex;gap:10px;align-items:center;text-align:left;padding:8px 12px}
.bub-h .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#111827;font:700 13px/26px var(--f-ui);text-align:center}
.bub-h .lab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--d)}
.bub-h .seg2{font-family:var(--f-fr);font-size:17px;color:var(--fg);flex:1;min-width:0}
.bub-h .chev{margin-left:auto;color:var(--d);transition:transform .15s}
.bub-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.bub-b{padding:0 14px 12px 50px;display:flex;flex-direction:column;gap:8px;font-size:15.5px}
.vh{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vbtn{border:1.5px dashed var(--d);background:var(--surface);color:var(--d);border-radius:9px;padding:5px 10px;font-size:13.5px;font-weight:700}
.vbtn:disabled{opacity:.4;cursor:default}
.vshow{font-family:var(--f-fr);font-size:20px;font-weight:600;letter-spacing:.02em}
.vshow.pat{letter-spacing:.12em;color:var(--d)}
.ta{width:100%;min-height:96px;font:inherit;font-family:var(--f-fr);font-size:22px;line-height:1.5;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface2);resize:vertical}
.ta:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.ta:disabled{opacity:.8}
.accbar{display:flex;flex-wrap:wrap;gap:6px}
.accbar button{min-width:38px;height:38px;border:1.5px solid var(--line);background:var(--surface2);border-radius:9px;font:600 18px var(--f-fr);padding:0 8px}
.accbar button:hover{border-color:var(--accent)}
.accbar .shift[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chunks{display:flex;flex-direction:column;gap:10px}
.chunk{border:2px solid var(--c);background:var(--t);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chunk .top2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chunk .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#111827;font:700 13px/26px var(--f-ui);text-align:center}
.chunk .segen{font-family:var(--f-fr);font-size:20px;font-weight:600}
.chunk .lab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--d)}
.chunk .ci{width:100%;font-family:var(--f-fr);font-size:21px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.chunk .ci:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.chunk .hb{border:0;background:transparent;color:var(--d);font-weight:700;font-size:13.5px;text-decoration:underline;padding:2px 4px;margin-left:auto}
.chunk.static{background:var(--surface2);border-color:var(--line);--c:var(--muted);--d:var(--muted)}
.zone{min-height:68px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface2)}
.zone .ph{color:var(--muted);font-size:15px}
.tile{font-family:var(--f-fr);font-size:21px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:11px;padding:5px 13px;transition:transform .1s}
.tile:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.zone .tile{border-color:var(--accent)}
.tile.used{opacity:.25;pointer-events:none}
.tile:disabled{cursor:default}
.tiles{display:flex;flex-wrap:wrap;gap:8px}

/* results */
.res{border-top:2px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.verdict .big{font:600 30px var(--f-head)}
.verdict .em{font-size:38px;line-height:1}
.verdict .pts{margin-left:auto;font:600 24px var(--f-head);font-variant-numeric:tabular-nums}
.verdict.full .big{color:var(--good)}.verdict.part .big{color:var(--warn)}.verdict.low .big{color:var(--bad)}
.pt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--t);border-left:6px solid var(--c);opacity:0;transform:translateY(6px);animation:rise .35s forwards;animation-delay:var(--dl,0s)}
@keyframes rise{to{opacity:1;transform:none}}
.pt .n{width:24px;height:24px;border-radius:50%;background:var(--c);color:#111827;font:700 12px/24px var(--f-ui);text-align:center}
.pt .fr{font-family:var(--f-fr);font-size:20px;font-weight:600;min-width:0}
.pt .en2{font-size:13.5px;color:var(--muted);font-weight:500;font-family:var(--f-ui)}
.pt .stt{font-weight:800;font-size:14px;white-space:nowrap;padding:3px 10px;border-radius:99px}
.pt.ok .stt{background:var(--good-t);color:var(--good)}
.pt.part .stt{background:var(--warn-t);color:var(--warn)}
.pt.no .stt{background:var(--bad-t);color:var(--bad)}
.pt .why{grid-column:2/-1;font-size:14px;color:var(--muted)}
.pt .why b{color:var(--fg)}
.pt.na{background:var(--surface2);border-left-color:var(--line)}
.model{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.model span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.model p{font-family:var(--f-fr);font-size:23px;margin-top:2px;line-height:1.5}
.model .note{font-family:var(--f-ui);font-size:14px;color:var(--muted);margin-top:4px}

/* summary */
.sum-hero{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#000) 100%);color:var(--on-accent);border-radius:22px;padding:clamp(20px,4vw,34px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;box-shadow:var(--shadow)}
@media(max-width:600px){.sum-hero{grid-template-columns:1fr}}
.sum-hero h1{font-size:clamp(30px,6vw,46px)}
.sum-hero p{opacity:.92;margin-top:6px}
.stars{font-size:34px;letter-spacing:4px;margin-top:6px}
.bigscore{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);border-radius:20px;padding:14px 26px;text-align:center}
.bigscore b{font:600 52px/1 var(--f-head);font-variant-numeric:tabular-nums;display:block}
.bigscore span{font-size:14px;font-weight:600;opacity:.92}
:root[data-theme="dark"] .sum-hero{background:linear-gradient(135deg,#27418A,#162754);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sum-hero{background:linear-gradient(135deg,#27418A,#162754);color:#fff}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:600 26px var(--f-head);font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,24px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.sec>h2{font-size:22px}
.bars{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:170px 1fr 52px;gap:10px;align-items:center;font-size:14.5px}
@media(max-width:520px){.br{grid-template-columns:110px 1fr 44px;font-size:13.5px}}
.br .tr{height:14px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.br .fl{display:block;height:100%;background:var(--c);width:0;transition:width .8s}
.rev{border:1px solid var(--line);border-radius:14px;background:var(--surface2);overflow:hidden}
.rev summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev summary .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-ui);color:var(--surface)}
.rev summary .k.full{background:var(--good)}.rev summary .k.part{background:var(--warn)}.rev summary .k.low{background:var(--bad)}.rev summary .k.skip{background:var(--muted)}
.rev summary .e{font-family:var(--f-fr);font-size:18px;flex:1;min-width:0}
.rev summary .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rev .in{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px}
.rev .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rev .yw{font-family:var(--f-fr);font-size:20px;color:var(--fg)}
.rev .km{font-family:var(--f-fr);font-size:20px;font-weight:600;color:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid var(--c);background:var(--t);color:var(--d)}
.chip.bad{opacity:.55;text-decoration:line-through}
.key p.full{font-family:var(--f-fr);font-size:clamp(20px,3.4vw,25px);line-height:1.7}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.tbl th,.tbl td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{background:var(--surface2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl td.fr{font-family:var(--f-fr);font-size:18px;font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.smap .sr2{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 86px;gap:6px 14px;padding:10px 12px;border-radius:12px;background:var(--t);border-left:6px solid var(--c);font-size:14.5px}
@media(max-width:640px){.smap .sr2{grid-template-columns:1fr}}
.smap{display:flex;flex-direction:column;gap:8px}
.smap b{color:var(--d)}
.smap .ex{font-family:var(--f-fr);font-size:16.5px}
.smap .nn{font-size:13px;color:var(--muted)}
.share{display:flex;gap:10px;flex-wrap:wrap}
a.btn{text-decoration:none;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:20;box-shadow:var(--shadow)}
.copybox{width:100%;min-height:120px;font-size:14px;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15;width:100%;height:100%}
.quit{background:var(--bad-t);border:1.5px solid var(--bad);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.pt{animation:none;opacity:1;transform:none}.br .fl,.ring .fg,.tile{transition:none}}

const DATA={"passages":[{"id":1,"num":4,"name":"Charles","gloss":"Charles","emoji":"🌳","marks":10,"source":"Charles is forty years old. He is married and has two daughters. He is the director of a publishing house. He has everything to be happy but still he is sad. He gets bored. He goes to the park. He meets an old man there. This man advises him to travel. Charles goes off on a trip. His life transforms!","sentences":[{"label":"","en":"Charles is forty years old.","tok":["Charles ",0," ",1," ",2,"."],"fr":"Charles a quarante ans.","note":"Age uses avoir. No word for “old”.","alts":[]},{"label":"","en":"He is married and has two daughters.","tok":["He ",3," and ",4," ",5,"."],"fr":"Il est marié et il a deux filles.","note":"Also fine: “et a deux filles”. Plural -s on filles.","alts":["et a deux filles"]},{"label":"","en":"He is the director of a publishing house.","tok":["He is ",6," ",7," ",8," ",9,"."],"fr":"Il est directeur d’une maison d’édition.","note":"Also accepted: “Il est le directeur d’une maison d’édition”.","alts":["Il est le directeur d’une maison d’édition"]},{"label":"","en":"He has everything to be happy but still he is sad.","tok":["He has ",10," ",11," ",12," ",13,"."],"fr":"Il a tout pour être heureux, mais il est quand même triste.","note":"Also accepted: “pourtant il est triste”.","alts":["pourtant il est triste"]},{"label":"","en":"He gets bored.","tok":[14," ",15," ",16,"."],"fr":"Il s’ennuie.","note":"Reflexive verb. -yer verb: y becomes i.","alts":[]},{"label":"","en":"He goes to the park.","tok":["He ",17," ",18," ",19,"."],"fr":"Il va au parc.","note":"à + le = au.","alts":[]},{"label":"","en":"He meets an old man there.","tok":["He ",20," an ",21," ",22," ",23,"."],"fr":"Il y rencontre un vieil homme.","note":"Also accepted: “Il rencontre un vieil homme là-bas” or “un vieux monsieur”.","alts":["Il rencontre un vieil homme là-bas","un vieux monsieur"]},{"label":"","en":"This man advises him to travel.","tok":[24," man ",25," ",26," ",27," ",28,"."],"fr":"Cet homme lui conseille de voyager.","note":"Also accepted: “Ce monsieur lui conseille de voyager”.","alts":["Ce monsieur lui conseille de voyager"]},{"label":"","en":"Charles goes off on a trip.","tok":["Charles ",29," ",30," ",31,"."],"fr":"Charles part en voyage.","note":"No word for “on”, no article after en.","alts":[]},{"label":"","en":"His life transforms!","tok":[32," ",33," ",34,35],"fr":"Sa vie se transforme !","note":"Sa agrees with vie. Space before the exclamation mark.","alts":[]}],"bubbles":[{"n":1,"cat":"T","strat":"tense","seg":"is","hint":"Present tense. No time markers, so keep the present for the whole text.","fr":"a","frs":["a"],"altv":[]},{"n":2,"cat":"S","strat":"check","seg":"forty","hint":"Learn your numbers: check the spelling of forty (40).","fr":"quarante","frs":["quarante"],"altv":[]},{"n":3,"cat":"S","strat":"drop","seg":"years old","hint":"Age: avoir, not être. There is no word for 'old'.","fr":"ans","frs":["ans"],"altv":[]},{"n":4,"cat":"T","strat":"noun","seg":"is married","hint":"Adjective after être: does it agree with 'he'?","fr":"est marié","frs":["est marié"],"altv":[]},{"n":5,"cat":"T","strat":"verb","seg":"has","hint":"Present tense of avoir. Repeat 'il' or leave it out?","fr":"il a","frs":["il a"],"altv":[]},{"n":6,"cat":"C","strat":"vocab","seg":"two daughters","hint":"One word means 'girl' and 'daughter'. Plural: add -s.","fr":"deux filles","frs":["deux filles"],"altv":["et a deux filles"]},{"n":7,"cat":"S","strat":"drop","seg":"the","hint":"Jobs: do you need an article after être?","fr":"-","frs":[],"altv":[]},{"n":8,"cat":"G","strat":"cog","seg":"director","hint":"Cognate! Watch the ending and the spelling.","fr":"directeur","frs":["directeur"],"altv":[]},{"n":9,"cat":"T","strat":"noun","seg":"of a","hint":"'House' is feminine. What happens to 'of' + 'a' before a vowel?","fr":"d’une","frs":["d’une"],"altv":[]},{"n":10,"cat":"S","strat":"wfw","seg":"publishing house","hint":"Set phrase: think 'house of edition'. Not word for word.","fr":"maison d’édition","frs":["maison d’édition"],"altv":[]},{"n":11,"cat":"S","strat":"wfw","seg":"everything","hint":"A short, very common word. Think of 'all'.","fr":"tout","frs":["tout"],"altv":[]},{"n":12,"cat":"T","strat":"inf","seg":"to be happy","hint":"'To' means 'in order to'. Which preposition, then which verb form?","fr":"pour être heureux","frs":["pour être heureux"],"altv":[]},{"n":13,"cat":"C","strat":"little","seg":"but still","hint":"Context: 'still' here means 'even so', not 'encore'.","fr":"mais il est quand même","frs":["mais il est quand même"],"altv":["pourtant il est triste"]},{"n":14,"cat":"T","strat":"noun","seg":"he is sad","hint":"Present tense of être + adjective: check the agreement.","fr":"triste","frs":["triste"],"altv":[]},{"n":15,"cat":"T","strat":"refl","seg":"He","hint":"Reflexive pronoun for 'il'. What happens before a vowel?","fr":"il","frs":["il"],"altv":[]},{"n":16,"cat":"S","strat":"refl","seg":"gets","hint":"Reflexive verb! Not always obvious from the English.","fr":"s’","frs":["s’"],"altv":[]},{"n":17,"cat":"C","strat":"vocab","seg":"bored","hint":"Think of 'ennui'. Careful: -yer verbs change y to i.","fr":"ennuie","frs":["ennuie"],"altv":[]},{"n":18,"cat":"T","strat":"verb","seg":"goes","hint":"Irregular verb. Which verb for 'go'? Which form for 'il'?","fr":"va","frs":["va"],"altv":[]},{"n":19,"cat":"T","strat":"noun","seg":"to the","hint":"'To the' + masculine noun: the two words join up.","fr":"au","frs":["au"],"altv":[]},{"n":20,"cat":"G","strat":"cog","seg":"park","hint":"Cognate. Check the spelling and the gender.","fr":"parc","frs":["parc"],"altv":[]},{"n":21,"cat":"C","strat":"vocab","seg":"meets","hint":"Context: he meets someone new. Which verb for 'to meet'?","fr":"rencontre","frs":["rencontre"],"altv":[]},{"n":22,"cat":"B","strat":"order","seg":"old","hint":"Word order: 'old' goes BEFORE the noun in French.","fr":"vieil","frs":["vieil"],"altv":["vieux monsieur"]},{"n":23,"cat":"T","strat":"noun","seg":"man","hint":"'Man' starts with a silent h: the adjective changes its form.","fr":"homme","frs":["homme"],"altv":["vieux monsieur"]},{"n":24,"cat":"B","strat":"order","seg":"there","hint":"'There': before the verb (y) or after it (là-bas)?","fr":"y","frs":["y"],"altv":["là bas"]},{"n":25,"cat":"T","strat":"noun","seg":"This","hint":"'This' changes before a vowel or a silent h.","fr":"cet","frs":["cet"],"altv":["ce monsieur"]},{"n":26,"cat":"F","strat":"cog","seg":"advises","hint":"False friend: not 'aviser'. Which verb means 'to advise'?","fr":"conseille","frs":["conseille"],"altv":[]},{"n":27,"cat":"B","strat":"order","seg":"him","hint":"Object pronoun goes BEFORE the verb. Advise TO someone: which one?","fr":"lui","frs":["lui"],"altv":[]},{"n":28,"cat":"T","strat":"inf","seg":"to","hint":"Which preposition follows 'advise someone'? Then the infinitive.","fr":"de","frs":["de"],"altv":[]},{"n":29,"cat":"F","strat":"cog","seg":"travel","hint":"False friend: not 'travailler'. Which verb means 'to travel'?","fr":"voyager","frs":["voyager"],"altv":[]},{"n":30,"cat":"S","strat":"wfw","seg":"goes off","hint":"Phrasal verb: not word for word. Think of 'to leave'.","fr":"part","frs":["part"],"altv":[]},{"n":31,"cat":"S","strat":"drop","seg":"on a","hint":"No word for 'on' here. Which preposition? Any article?","fr":"en","frs":["en"],"altv":[]},{"n":32,"cat":"C","strat":"vocab","seg":"trip","hint":"Not a cognate. Same family as the verb for 'travel'.","fr":"voyage","frs":["voyage"],"altv":[]},{"n":33,"cat":"T","strat":"noun","seg":"His","hint":"'His' agrees with the thing owned (life), not the owner.","fr":"sa","frs":["sa"],"altv":[]},{"n":34,"cat":"C","strat":"vocab","seg":"life","hint":"Not a cognate. Think of 'vital' or 'vitamin'.","fr":"vie","frs":["vie"],"altv":[]},{"n":35,"cat":"S","strat":"refl","seg":"transforms","hint":"Reflexive again: the life transforms itself. Cognate verb.","fr":"se transforme","frs":["se transforme"],"altv":[]},{"n":36,"cat":"S","strat":"check","seg":"!","hint":"Punctuation: French puts a space before ! ? : and ;","fr":"!","frs":["!"],"altv":[]}]},{"id":2,"num":5,"name":"Le stage en entreprise","gloss":"Work placement","emoji":"💼","marks":10,"source":"Before entering the “real” world of work, many young people, in France, do an internship in a company. Often, young French people have a placement during their first year, at the age of 16 or 17, for a period of two weeks on average. There are also schools in European countries which, each year, organize work placements in France for some of their students who speak French well and who know how to get by. Most of the trainees have already done a school exchange in France. As often happens in the context of a school exchange, these young “interns” are housed with a French family and they spend part of their time with their correspondents. Their company internship lasts four or five days.","sentences":[{"label":"","en":"Before entering the “real” world of work, many young people, in France, do an internship in a company.","tok":[0," ",1," ",2," ",3,", ",4,", ",5,", ",6," ",7,"."],"fr":"Avant d’entrer dans le monde « réel » du travail, beaucoup de jeunes, en France, font un stage dans une entreprise.","note":"Also accepted: “de nombreux jeunes”, “un stage en entreprise”.","alts":["de nombreux jeunes","un stage en entreprise"]},{"label":"","en":"Often, young French people have a placement during their first year, at the age of 16 or 17, for a period of two weeks on average.","tok":[8,", ",9," ",10," ",11,", ",12,", ",13," ",14,"."],"fr":"Souvent, les jeunes Français ont un stage pendant leur première année, à l’âge de 16 ou 17 ans, pour une durée de deux semaines en moyenne.","note":"Also accepted: “font un stage”, “pour une période de”.","alts":["font un stage","pour une période de"]},{"label":"","en":"There are also schools in European countries which, each year, organize work placements in France for some of their students who speak French well and who know how to get by.","tok":[15," ",16," ",17,", ",18,", ",19," ",20," ",21," and ",22,"."],"fr":"Il y a aussi des écoles dans des pays européens qui, chaque année, organisent des stages en France pour certains de leurs élèves qui parlent bien français et qui savent se débrouiller.","note":"Also accepted: “des établissements scolaires”, “qui savent se débrouiller” or “qui se débrouillent”.","alts":["des établissements scolaires","qui savent se débrouiller","qui se débrouillent"]},{"label":"","en":"Most of the trainees have already done a school exchange in France.","tok":[23," ",24," ",25," ",26,"."],"fr":"La plupart des stagiaires ont déjà fait un échange scolaire en France.","note":"“La plupart des stagiaires” takes a plural verb here.","alts":[]},{"label":"","en":"As often happens in the context of a school exchange, these young “interns” are housed with a French family and they spend part of their time with their correspondents.","tok":[27," ",28,", ",29," ",30," ",31," and ",32," ",33,"."],"fr":"Comme cela arrive souvent dans le cadre d’un échange scolaire, ces jeunes « stagiaires » sont logés dans une famille française et ils passent une partie de leur temps avec leurs correspondants.","note":"Also accepted: “hébergés”, “comme c’est souvent le cas dans le cadre d’un échange”.","alts":["hébergés","comme c’est souvent le cas dans le cadre d’un échange"]},{"label":"","en":"Their company internship lasts four or five days.","tok":[34," ",35," ",36," ",37,"."],"fr":"Leur stage en entreprise dure quatre ou cinq jours.","note":"Also fine: “Leur stage dure quatre ou cinq jours”.","alts":["Leur stage dure quatre ou cinq jours"]}],"bubbles":[{"n":1,"cat":"T","strat":"inf","seg":"Before entering","hint":"Before + -ing: avant + preposition + infinitive.","fr":"Avant d’entrer","frs":["Avant d’entrer"],"altv":[]},{"n":2,"cat":"S","strat":"drop","seg":"the","hint":"'Enter' is followed by a preposition in French. Which one?","fr":"dans le","frs":["dans le"],"altv":[]},{"n":3,"cat":"B","strat":"order","seg":"“real” world","hint":"The adjective goes AFTER the noun. Use French quotation marks.","fr":"monde « réel »","frs":["monde « réel »"],"altv":[]},{"n":4,"cat":"S","strat":"drop","seg":"of work","hint":"French needs the article: 'of the work'. de + le = ?","fr":"du travail","frs":["du travail"],"altv":[]},{"n":5,"cat":"T","strat":"noun","seg":"many young people","hint":"Beaucoup de + noun. 'Young people' is one plural noun.","fr":"beaucoup de jeunes","frs":["beaucoup de jeunes"],"altv":["de nombreux jeunes"]},{"n":6,"cat":"S","strat":"little","seg":"in France","hint":"Which preposition goes with a feminine country?","fr":"en France","frs":["en France"],"altv":[]},{"n":7,"cat":"S","strat":"wfw","seg":"do an internship","hint":"Not word for word: French 'makes' an internship. Not a cognate.","fr":"font un stage","frs":["font un stage"],"altv":[]},{"n":8,"cat":"C","strat":"vocab","seg":"in a company","hint":"A company = une entreprise (think 'enterprise'). Which preposition?","fr":"dans une entreprise","frs":["dans une entreprise"],"altv":["un stage en entreprise"]},{"n":9,"cat":"C","strat":"time","seg":"Often","hint":"Time and frequency word to learn. Check the spelling.","fr":"Souvent","frs":["Souvent"],"altv":[]},{"n":10,"cat":"T","strat":"noun","seg":"young French people","hint":"'The young' acts as a noun. A nationality noun has a capital letter.","fr":"les jeunes Français","frs":["les jeunes Français"],"altv":[]},{"n":11,"cat":"S","strat":"wfw","seg":"have a placement","hint":"The same word as before: un stage. Avoir or faire both work.","fr":"ont un stage","frs":["ont un stage"],"altv":["font un stage"]},{"n":12,"cat":"T","strat":"noun","seg":"during their first year","hint":"'Their' + ONE year: leur or leurs? 'First' agrees with année.","fr":"pendant leur première année","frs":["pendant leur première année"],"altv":[]},{"n":13,"cat":"S","strat":"wfw","seg":"at the age of 16 or 17","hint":"Age: à l'âge de + numbers + the vé","frs":["a trouvé"],"altv":[]},{"n":6,"cat":"C","strat":"vocab","seg":"a cat","hint":"Vocabulary: a cat = un chat (masculine).","fr":"un chat","frs":["un chat"],"altv":[]},{"n":7,"cat":"T","strat":"tense","seg":"which was sleeping","hint":"'Was sleeping' = imparfait only. 'Which' = the subject: qui.","fr":"qui dormait","frs":["qui dormait"],"altv":[]},{"n":8,"cat":"T","strat":"noun","seg":"on his bench","hint":"'His' agrees with 'bench': son or sa?","fr":"sur son banc","frs":["sur son banc"],"altv":[]},{"n":9,"cat":"T","strat":"tense","seg":"said","hint":"One action: passé composé of an irregular verb.","fr":"a dit","frs":["a dit"],"altv":[]},{"n":10,"cat":"T","strat":"verb","seg":"Go home!","hint":"Command to a cat: tu form. 'Home' = chez + pronoun.","fr":"Rentre chez toi !","frs":["Rentre chez toi !"],"altv":["rentre à la maison"]},{"n":11,"cat":"S","strat":"wfw","seg":"It is too cold","hint":"Weather uses faire, not être. 'Too' = trop.","fr":"Il fait trop froid","frs":["Il fait trop froid"],"altv":[]},{"n":12,"cat":"S","strat":"check","seg":"here this evening!","hint":"'This evening' = ce soir. Space before ! and inside « ».","fr":"ici ce soir !","frs":["ici ce soir !"],"altv":[]},{"n":13,"cat":"C","strat":"time","seg":"The next morning","hint":"Time phrase: 'the next day' + morning. Learn le lendemain.","fr":"Le lendemain matin","frs":["Le lendemain matin"],"altv":[]},{"n":14,"cat":"S","strat":"wfw","seg":"to his surprise","hint":"Set phrase: 'to his surprise'. 'His' agrees with surprise.","fr":"à sa surprise","frs":["à sa surprise"],"altv":["à sa grande surprise"]},{"n":15,"cat":"T","strat":"tense","seg":"found","hint":"One event: passé composé. Same verb as before.","fr":"a trouvé","frs":["a trouvé"],"altv":[]},{"n":16,"cat":"C","strat":"stuck","seg":"still there","hint":"'Still' here = toujours (not encore). 'There' = là.","fr":"toujours là","frs":["toujours là"],"altv":[]},{"n":17,"cat":"C","strat":"time","seg":"Now","hint":"Time word: a long one that starts with 'main'.","fr":"Maintenant","frs":["Maintenant"],"altv":[]},{"n":18,"cat":"T","strat":"noun","seg":"this cat","hint":"'This' + masculine noun: ce. Same noun as before.","fr":"ce chat","frs":["ce chat"],"altv":[]},{"n":19,"cat":"T","strat":"noun","seg":"is always with him","hint":"After avec use a stressed pronoun: lui. 'Always' = toujours.","fr":"est toujours avec lui","frs":["est toujours avec lui"],"altv":[]}]},{"id":7,"num":10,"name":"Les vacances au Cachemire","gloss":"Holidays in Kashmir","emoji":"⛷️","marks":5,"source":"In the winter holidays, when it is cold, we go to Kashmir. There is always a lot of snow. My whole family loves to ski. The last time we went there, I learnt the sport. Once I fell down but I was brave.","sentences":[{"label":"","en":"In the winter holidays, when it is cold, we go to Kashmir.","tok":[0,", ",1,", we ",2," ",3,"."],"fr":"Pendant les vacances d’hiver, quand il fait froid, nous allons au Cachemire.","note":"“Kashmir” is Cachemire in French.","alts":[]},{"label":"","en":"There is always a lot of snow.","tok":[4," ",5," ",6,"."],"fr":"Il y a toujours beaucoup de neige.","note":"","alts":[]},{"label":"","en":"My whole family loves to ski.","tok":[7," ",8," ",9,"."],"fr":"Toute ma famille adore skier.","note":"Also accepted: “Ma famille entière adore skier / faire du ski”.","alts":["Ma famille entière adore skier","faire du ski"]},{"label":"","en":"The last time we went there, I learnt the sport.","tok":[10," ",11,", I ",12," ",13,"."],"fr":"La dernière fois que nous y sommes allés, j’ai appris ce sport.","note":"Also accepted: “le sport”, “à skier”, “là-bas”.","alts":["le sport","à skier","là-bas"]},{"label":"","en":"Once I fell down but I was brave.","tok":[14," I ",15," but I ",16,"."],"fr":"Une fois, je suis tombé mais j’ai été courageux.","note":"“tombée”, “courageuse” if a girl; “j’étais courageux” is also accepted.","alts":[]}],"bubbles":[{"n":1,"cat":"S","strat":"wfw","seg":"In the winter holidays","hint":"'Holidays' is   const sim = (a, b) => { a = sq(a); b = sq(b); const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 1; };

  /* score values: [exact, accent, squash, gap, typo, agreement, anchor] per style */
  const VAL = {
    strict:   { acc: .5,  sq: .5,  gap: 0, typo: 0,  agr: .5,  anc: 0 },
    flexible: { acc: .75, sq: .75, gap: 1, typo: .5, agr: .75, anc: .5 },
    generous: { acc: 1,   sq: 1,   gap: 1, typo: .75, agr: 1,  anc: 1 }
  };

  const range = (i, n) => Array.from({ length: n }, (_, k) => i + k);
  function findExact(T, F, used, acc) {
    const n = F.length;
    for (let i = 0; i + n <= T.length; i++) {
      let ok = true;
      for (let k = 0; k < n; k++) {
        if (used.has(i + k) || (acc ? na(T[i + k]) !== na(F[k]) : T[i + k] !== F[k])) { ok = false; break; }
      }
      if (ok) return range(i, n);
    }
    return null;
  }
  function findGap(T, F, used) {
    if (F.length < 2) return null;
    for (let i = 0; i < T.length; i++) {
      if (used.has(i) || na(T[i]) !== na(F[0])) continue;
      const pos = [i]; let j = i + 1, ok = true;
      for (let k = 1; k < F.length; k++) {
        if (j < T.length && !used.has(j) && na(T[j]) === na(F[k])) { pos.push(j); j++; }
        else if (j + 1 < T.length && !used.has(j) && !used.has(j + 1) && na(T[j + 1]) === na(F[k])) { pos.push(j + 1); j += 2; }
        else { ok = false; break; }
      }
      if (ok) return pos;
    }
    return null;
  }
  function findSquash(T, F, used) {
    const target = sq(F.join(''));
    const n = F.length;
    for (let w = Math.max(1, n - 1); w <= n + 1; w++) {
      for (let i = 0; i + w <= T.length; i++) {
        const pos = range(i, w);
        if (pos.some(p => used.has(p))) continue;
        if (sq(pos.map(p => T[p]).join('')) === target) return pos;
      }
    }
    return null;
  }
  function tol(w) { return w.length >= 9 ? 2 : w.length >= 5 ? 1 : 0; }
  function findFuzzy(T, F, used) {
    const n = F.length;
    for (let i = 0; i + n <= T.length; i++) {
      let ok = true, kind = null;
      for (let k = 0; k < n; k++) {
        const a = na(T[i + k]), b = na(F[k]);
        if (used.has(i + k)) { ok = false; break; }
        if (a === b) continue;
        if (agr(a, b)) { kind = kind || 'agr'; continue; }
        if (lev(a, b) <= tol(b)) { kind = 'typo'; continue; }
        ok = false; break;
      }
      if (ok && kind) return { pos: range(i, n), kind };
    }
    return null;
  }
  function anchorOf(F) {
    const c = F.map(na).filter(w => w.length >= 4 && !STOP.has(w));
    return c.sort((a, b) => b.length - a.length)[0] || null;
  }
  function findAnchor(T, anchor, used) {
    for (let i = 0; i < T.length; i++) {
      if (used.has(i)) continue;
      const a = na(T[i]);
      if (a === anchor || (anchor.length >= 5 && lev(a, anchor) <= 1)) return [i];
    }
    return null;
  }

  /* best result for one fragment variant against one pool */
  function tryVariant(pool, frag, style, stage) {
    const V = VAL[style];
    const F = toks(frag);
    if (!F.length) return null;
    let best = null;
    const take = (s, kind, pos) => { if (s > 0 && (!best || s > best.s)) best = { s, kind, pos }; };
    if (stage === 1) {
      let p = findExact(pool.T, F, pool.used, false);
      if (p) take(1, 'exact', p);
      else if ((p = findExact(pool.T, F, pool.used, true))) take(V.acc, 'accent', p);
    } else {
      let p = findSquash(pool.T, F, pool.used);
      if (p) take(V.sq, 'squash', p);
      if ((p = findGap(pool.T, F, pool.used))) take(V.gap, 'gap', p);
      const f = findFuzzy(pool.T, F, pool.used);
      if (f) take(f.kind === 'agr' ? V.agr : V.typo, f.kind, f.pos);
      const an = anchorOf(F);
      if (an && (p = findAnchor(pool.T, an, pool.used))) take(V.anc, 'anchor', p);
    }
    return best;
  }

  function punctScore(text, frag, style, chunk) {
    const c = frag.trim();
    if (/^[!?:;]$/.test(c)) {
      const t = text.replace(/[\u00a0\u202f]/g, ' ');
      const re = chunk ? new RegExp('^\\s+[' + c + ']') : new RegExp('[^\\s]\\s[' + c + ']');
      if (re.test(t)) return { s: 1, kind: 'exact' };
      if (t.includes(c)) return { s: VAL[style].acc, kind: 'accent' };
      return { s: 0, kind: 'none' };
    }
    return { s: text.includes(c) ? 1 : 0, kind: text.includes(c) ? 'exact' : 'none' };
  }

  function expandApos(raw, expected, E) {
    const T = [], exp = new Set();
    raw.forEach(w => {
      const a = na(w);
      if (w.includes("'") || expected.has(a) || a.length < 2) { T.push(w); return; }
      for (const e of E) {
        const ew = na(e.slice(0, -1));
        if (a.startsWith(ew) && expected.has(a.slice(ew.length))) {
          exp.add(T.length); exp.add(T.length + 1); T.push(e, w.slice(ew.length)); return;
        }
      }
      T.push(w);
    });
    return { T, exp };
  }

  /* Score one sentence.
     pools: array (one per bubble) of raw student strings, or a single string for a whole-sentence answer */
  function scoreSentence(sent, bubbles, input, style) {
    const mode = Array.isArray(input) ? 'chunk' : 'whole';
    const poolFor = [];
    const expected = new Set(), E = [];
    toks(sent.fr).forEach(t => { expected.add(na(t)); if (t.endsWith("'") && !E.includes(t)) E.push(t); });
    bubbles.forEach(b => b.frs.forEach(f => toks(f).forEach(t => { expected.add(na(t)); if (t.endsWith("'") && !E.includes(t)) E.push(t); })));
    const mk = raw => { const x = expandApos(toks(raw), expected, E); return { T: x.T, exp: x.exp, used: new Set(), raw }; };
    if (mode === 'whole') {
      const pool = mk(input);
      bubbles.forEach(() => poolFor.push(pool));
    } else {
      bubbles.forEach((b, i) => poolFor.push(mk(input[i] || '')));
    }
    const res = bubbles.map(b => ({ b, s: 0, kind: 'none', said: '', scored: b.frs.length > 0 }));
    const isPunct = b => b.frs.length && !/[a-zà-ÿ0-9]/i.test(b.frs[0]);
    // punctuation bubbles
    bubbles.forEach((b, i) => {
      if (res[i].scored && isPunct(b)) { const r = punctScore(poolFor[i].raw, b.frs[0], style, mode === 'chunk'); res[i].s = r.s; res[i].kind = r.kind; res[i].done = true; }
    });
    // stage 1 (exact / accent) then stage 2 (loose); longest fragments claim first
    const idx = bubbles.map((b, i) => i).filter(i => res[i].scored && !res[i].done)
      .sort((a, b) => toks(bubbles[b].frs[0]).length - toks(bubbles[a].frs[0]).length);
    [1, 2].forEach(stage => {
      idx.forEach(i => {
        if (res[i].done) return;
        let best = null;
        bubbles[i].frs.forEach(fr => {
          const r = tryVariant(poolFor[i], fr, style, stage);
          if (r && (!best || r.s > best.s)) best = r;
        });
        if (best && best.s < 1 + 1e-9 && best.pos.some(p => poolFor[i].exp.has(p)) && best.kind === 'exact') { best.s = Math.min(best.s, VAL[style].acc); best.kind = 'apos'; }
        if (best && best.s > res[i].s) {
          const prev = res[i];
          if (prev.pos) prev.pos.forEach(p => poolFor[i].used.delete(p));
          res[i].s = best.s; res[i].kind = best.kind; res[i].pos = best.pos;
          best.pos.forEach(p => poolFor[i].used.add(p));
          res[i].said = best.pos.map(p => poolFor[i].T[p]).join(' ').replace(/' /g, "'");
          if (best.s === 1 && best.kind === 'exact') res[i].done = true;
        }
      });
    });
    // teacher-listed alternatives (variants of a point, matched without using up words)
    bubbles.forEach((b, i) => {
      if (!res[i].scored || res[i].s >= 1) return;
      for (const av of (b.altv || [])) {
        const hit = findExact(poolFor[i].T, toks(av), new Set(), true);
        if (hit) { res[i].s = 1; res[i].kind = 'alt'; res[i].said = hit.map(p => poolFor[i].T[p]).join(' ').replace(/' /g, "'"); break; }
      }
    });
    // whole-sentence alternatives, with a little tolerance for typos
    const allText = mode === 'whole' ? input : input.join(' ');
    const modelToks = toks(sent.fr).length;
    (sent.alts || []).forEach(alt => {
      if (alt.endsWith('…') || toks(alt).length < modelToks * 0.6) return;
      if (sim(allText, alt) >= 0.9) res.forEach(r => { if (r.scored && r.s < 1) { r.s = 1; r.kind = 'alt'; } });
    });
    return res;
  }

  const COST = { free: [0, 0], light: [0.1, 0.25], standard: [0.2, 0.5] };
  function finalise(res, usage, costKey) {
    const c = COST[costKey] || COST.light;
    let total = 0, max = 0, lost = 0;
    res.forEach((r, i) => {
      if (!r.scored) { r.final = 0; return; }
      const u = usage[i] || 0;
      const cost = u ? c[u - 1] : 0;
      r.cost = cost;
      r.final = r.s > 0 ? Math.max(0, r.s - cost) : 0;
      if (r.s > 0) lost += r.s - r.final;
      total += r.final; max += 1;
    });
    return { total, max, lost };
  }

  return { scoreSentence, finalise, toks, na, sim, COST, VAL };
})();
if (typeof module !== 'undefined') module.exports = Engine;

</script>
<script>
/* ===== Traduisez ! English -> French translation lab. Needs: DATA (passages, strats) and Engine. ===== */
const CAT = {
  B: { n: 'Breaking it down', d: 'Split the sentence into chunks and translate one piece at a time.' },
  C: { n: 'Context', d: 'Use common sense and the story to pick the right word.' },
  G: { n: 'Cognates', d: 'Words that look alike and mean the same. Watch the spelling.' },
  F: { n: 'False friends', d: 'Words that look alike but do not mean the same.' },
  T: { n: 'Grammar & tense', d: 'Choose the tense, the agreement and the verb form.' },
  S: { n: 'Translation skills', d: 'Do not go word for word. Think how a French speaker says it.' }
};
const MODELS = {
  type: { n: 'Type the sentence', lv: 'Challenge', d: 'Write the whole French sentence yourself. Hint bubbles are on hand. The closest match to the paper version.', ex: ['Il', 'a', 'quarante', 'ans'] },
  chunk: { n: 'Chunk by chunk', lv: 'Guided', d: 'One box for each highlighted chunk. A gentler start that shows where every point is earned.', ex: ['[1] a', '[2] quarante', '[3] ans'] },
  tiles: { n: 'Word tiles', lv: 'Easiest', d: 'Tap French words in the right order. A few extra words are there to tempt you. Works well on a phone.', ex: ['Charles', 'a', 'quarante', 'ans'] }
};
const STYLES = {
  strict: ['Strict', 'Spelling and accents count. Only the listed answers are accepted.'],
  flexible: ['Flexible', 'Accepts the listed alternatives, small slips in accents or spelling for part marks, and a spare word inside a phrase.'],
  generous: ['Generous', 'The key word is enough for the point. Good for a first go.']
};
const COSTS = { free: ['Free', 'Vocab hints cost nothing.'], light: ['Light', 'First letters −0.1, the French word −0.25.'], standard: ['Standard', 'First letters −0.2, the French word −0.5.'] };
const COSTV = Engine.COST;
const ACC = ['é', 'è', 'ê', 'ë', 'à', 'â', 'ç', 'î', 'ï', 'ô', 'ù', 'û', 'ü', 'œ', '’', '«', '»'];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => (Math.round(n * 100) / 100).toString();
const store = {
  get(k, d) { try { const v = localStorage.getItem('flh_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('flh_' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
};
const P = DATA.passages;
const STRAT = Object.fromEntries(DATA.strats.map(s => [s.id, s]));

const st = {
  view: 'home', name: store.get('name', ''), pid: null, model: store.get('model', 'type'),
  style: store.get('style', 'flexible'), cost: store.get('cost', 'light'), read: store.get('read', 120), sound: store.get('sound', true),
  run: null, best: store.get('best', {}), shift: false, quit: false, timer: null
};
try { const q = new URLSearchParams(location.search); if (q.has('read')) st.read = +q.get('read') * 60; } catch (e) { /* ignore */ }

/* ---------------- sounds ---------------- */
const Snd = {
  ctx: null,
  init() {
    if (!st.sound) return;
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, at, dur, type, vol) {
    if (!st.sound || !this.ctx) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  good(k) { const b = [523.25, 587.33, 659.25, 783.99, 880, 987.77][k % 6]; this.tone(b, 0, .16, 'triangle', .17); this.tone(b * 1.5, .07, .2, 'sine', .1); },
  almost() { this.tone(440, 0, .13, 'sine', .15); this.tone(494, .11, .18, 'sine', .15); },
  bad() { this.tone(190, 0, .2, 'sawtooth', .09); this.tone(140, .13, .26, 'sawtooth', .09); },
  tick() { this.tone(900, 0, .05, 'square', .05); },
  chime() { [659, 784, 988].forEach((f, i) => this.tone(f, i * .14, .3, 'sine', .15)); },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * .11, .26, 'triangle', .15)); },
  sad() { this.tone(330, 0, .25, 'sine', .12); this.tone(262, .22, .35, 'sine', .12); }
};

/* ---------------- helpers on data ---------------- */
const bubblesOf = (p, s) => s.tok.filter(t => typeof t === 'number').map(i => ({ ...p.bubbles[i], i }));
function sentHTML(p, s, only) {
  return s.tok.map(t => {
    if (typeof t === 'string') return esc(t);
    const b = p.bubbles[t];
    if (only !== undefined && only !== t) return esc(b.seg);
    return `<mark class="c-${b.cat}">${esc(b.seg)}<sup>${b.n}</sup></mark>`;
  }).join('');
}
function pattern(fr) {
  return fr.split(' ').map(w => { let first = true; return [...w].map(ch => { if (!/[\p{L}]/u.test(ch)) return ch; if (first) { first = false; return ch; } return '·'; }).join(''); }).join(' ');
}
function newRun(p) {
  return { p, si: 0, ans: p.sentences.map((s, i) => ({ text: '', chunks: {}, tiles: [], open: {}, usage: {}, res: null, fin: null, input: null, tl: null })), done: false };
}
const hintCost = () => COSTV[st.cost] || COSTV.light;

/* word tiles */
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296; }
function tileSet(p, si) {
  const s = p.sentences[si];
  const toks = s.fr.split(/\s+/).filter(Boolean);
  let end = '';
  if (/\.$/.test(toks[toks.length - 1])) { toks[toks.length - 1] = toks[toks.length - 1].slice(0, -1); end = '.'; }
  const firstEn = (s.en.split(/\s+/)[0] || '').replace(/[^\p{L}]/gu, '');
  if (toks[0] && toks[0].replace(/[^\p{L}]/gu, '') !== firstEn) toks[0] = toks[0][0].toLowerCase() + toks[0].slice(1);
  const have = new Set(toks.map(t => t.toLowerCase()));
  const pool = [];
  p.sentences.forEach((o, k) => { if (k !== si) o.fr.split(/\s+/).forEach(w => { w = w.replace(/[.,!?]$/, ''); if (w && /^[a-zàâçéèêëîïôûùüœ’'-]+$/.test(w) && !have.has(w) && !pool.includes(w)) pool.push(w); }); });
  const r = rng(p.id * 131 + si * 17 + 5);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const nd = toks.length <= 4 ? 2 : toks.length <= 9 ? 3 : 4;
  const all = toks.map(w => ({ w, d: false })).concat(pool.slice(0, nd).map(w => ({ w, d: true })));
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  return { tiles: all, end };
}

/* ---------------- views ---------------- */
const TOP = () => `<div class="topwrap"><div class="top">
  <div class="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#1F46A8"/><rect x="0" y="23" width="34" height="11" fill="#FFFFFF" opacity=".0"/><path d="M7 10h20M7 17h20M7 24h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="24" r="3.4" fill="#D63C3F"/></svg>
  <div><b>Learn French with Haresh Sir</b><small>Fravashi Academy · Traduisez !</small></div></div>
  ${st.view !== 'home' ? `<button class="iconbtn" data-act="${st.view === 'play' ? 'quit-ask' : 'home'}">Home</button>` : ''}
  <button class="iconbtn" data-act="snd" aria-pressed="${st.sound}" aria-label="Sound ${st.sound ? 'on' : 'off'}">${st.sound ? 'Sound on' : 'Sound off'}</button></div></div><div class="flag" aria-hidden="true"></div>`;

function viewHome() {
  const cards = P.map(p => {
    const b = st.best[p.id];
    return `<button class="tcard" data-act="pick" data-id="${p.id}" aria-pressed="${st.pid === p.id}">
      ${b ? `<span class="best">Best ${b}%</span>` : ''}<span class="em" aria-hidden="true">${p.emoji}</span><span class="no">Text ${p.id}</span>
      <span class="ti">${esc(p.name)}</span><span class="gl">${esc(p.gloss)}</span>
      <span class="meta">${p.sentences.length} sentences${p.marks ? ' · ' + p.marks + ' marks' : ''}</span></button>`;
  }).join('');
  const models = Object.keys(MODELS).map(k => `<button class="mcard" data-act="model" data-m="${k}" aria-pressed="${st.model === k}">
      <span class="lv">${MODELS[k].lv}</span><b>${MODELS[k].n}</b><p>${MODELS[k].d}</p></button>`).join('');
  const seg = (name, obj, cur, extra) => `<div class="seg" role="group" aria-label="${name}">${Object.keys(obj).map(k => `<button data-act="opt" data-o="${name}" data-v="${k}" aria-pressed="${cur === k}">${obj[k][0]}</button>`).join('')}</div>`;
  const readSeg = `<div class="seg" role="group" aria-label="Reading time">${[[0, 'None'], [60, '1 min'], [120, '2 min'], [180, '3 min']].map(x => `<button data-act="opt" data-o="read" data-v="${x[0]}" aria-pressed="${st.read === x[0]}">${x[1]}</button>`).join('')}</div>`;
  const sel = P.find(p => p.id === st.pid);
  return `<section class="hero"><h1>Traduisez<span> !</span></h1>
    <p>Read the English text, think with the colour-coded hint bubbles, then write it in French. Every answer is marked on the spot, and you finish with a summary and the answer key. No paper needed.</p></section>
  <section class="step"><h2><span class="stepn">1</span>Your name</h2>
    <label class="sr" for="name">Your name</label><input id="name" class="namebox" type="text" autocomplete="off" placeholder="Type your first name" value="${esc(st.name)}" maxlength="40"></section>
  <section class="step"><h2><span class="stepn">2</span>Choose a text</h2><div class="tgrid">${cards}</div></section>
  <section class="step"><h2><span class="stepn">3</span>Choose how to work</h2><div class="mgrid">${models}</div></section>
  <details class="teacher"><summary>Teacher options</summary><div class="opts">
    <div class="opt"><h4>Marking style</h4>${seg('style', STYLES, st.style)}<p>${STYLES[st.style][1]}</p></div>
    <div class="opt"><h4>Vocab hint cost</h4>${seg('cost', COSTS, st.cost)}<p>${COSTS[st.cost][1]}</p></div>
    <div class="opt"><h4>Reading time before starting</h4>${readSeg}<p>The Start button unlocks when the time is up.</p></div></div></details>
  <div class="startbar"><button class="btn big" data-act="start" ${st.pid ? '' : 'disabled'}>${st.pid ? 'Start “' + esc(sel.name) + '”' : 'Pick a text to start'}</button>
  <span>${st.read ? 'You get ' + (st.read / 60) + (st.read === 60 ? ' minute' : ' minutes') + ' to read the text first.' : 'No reading time is set.'}</span></div>`;
}

function viewRead() {
  const p = st.run.p;
  const paras = p.sentences.map(s => s.label === 'Title' ? `<p style="font-weight:600;margin-bottom:4px">${sentHTML(p, s)}</p>` : '').join('');
  const body = p.sentences.filter(s => s.label !== 'Title').map(s => sentHTML(p, s)).join(' ');
  const legend = Object.keys(CAT).map(k => `<div class="lg c-${k}"><i></i><div><b>${CAT[k].n}</b>${CAT[k].d}</div></div>`).join('');
  return `<div class="pagehead"><div><small>Text ${p.id} · read first</small><h1>${esc(p.name)}</h1></div></div>
  <div class="readgrid"><div class="paper"><span class="lab">Read carefully. Notice the highlighted chunks.</span>${paras}<p>${body}</p></div>
  <aside class="timer" aria-live="off"><div class="ring"><svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle class="bg" cx="66" cy="66" r="58"/><circle class="fg" id="ringfg" cx="66" cy="66" r="58" stroke-dasharray="364.4" stroke-dashoffset="0"/></svg><div class="t" id="tt">2:00</div></div>
  <p id="tmsg">Reading time</p><button class="btn" id="beginbtn" data-act="begin" disabled>Start translating</button></aside></div>
  <section class="sec"><h2>The six kinds of hint bubble</h2><div class="legend">${legend}</div>
  <p class="hint-note">Bubbles are free to read. If you are stuck on a word, you can ask for a vocab hint, but it costs part of the mark.</p></section>`;
}

function accBar() {
  const letters = ACC.map(c => { const v = st.shift && c.toLowerCase() !== c.toUpperCase() ? c.toUpperCase() : c; return `<button type="button" data-act="ins" data-c="${v}" aria-label="Insert ${v}">${v}</button>`; }).join('');

}

function bubbleCard(p, b, A, locked) {
  const open = A.open[b.i];
  const u = A.usage[b.i] || 0;
  const c = hintCost();
  let vh = '';
  if (!b.frs.length) vh = '<span class="hint-note">No French word is needed for this one.</span>';
  else if (st.model !== 'tiles') {
    const lab1 = st.cost === 'free' ? '' : ` (−${fmt(c[0])})`, lab2 = st.cost === 'free' ? '' : ` (−${fmt(c[1])} in all)`;
    vh = `<div class="vh">${u === 0 ? `<button class="vbtn" data-act="vh" data-b="${b.i}" data-l="1" ${locked ? 'disabled' : ''}>First letters${lab1}</button>` : ''}
      ${u < 2 ? `<button class="vbtn" data-act="vh" data-b="${b.i}" data-l="2" ${locked ? 'disabled' : ''}>Show the French${lab2}</button>` : ''}
      ${u === 1 ? `<span class="vshow pat">${esc(pattern(b.frs[0]))}</span>` : ''}${u === 2 ? `<span class="vshow">${esc(b.frs[0])}</span>` : ''}</div>`;
  }
  return `<div class="bub c-${b.cat}"><button class="bub-h" data-act="bub" data-b="${b.i}" aria-expanded="${!!open}"><span class="n">${b.n}</span>
    <span class="lab">${CAT[b.cat].n}</span><span class="seg2">${esc(b.seg)}</span><span class="chev" aria-hidden="true">▾</span></button>
    ${open ? `<div class="bub-b"><p>${esc(b.hint)}</p>${vh}</div>` : ''}</div>`;
}

const KIND = {
  exact: ['Correct', ''], accent: ['Almost', 'Check the accents'], apos: ['Almost', 'Remember the apostrophe'], squash: ['Almost', 'Spacing or apostrophe slip'],
  typo: ['Almost', 'Spelling slip'], agr: ['Almost', 'Check the agreement (gender or plural)'], anchor: ['Almost', 'Right idea, but the form is not quite right'],
  gap: ['Correct', 'Accepted, with an extra word in between'], alt: ['Correct', 'Accepted alternative'], none: ['Missing', '']
};
function resultRows(p, bs, A) {
  let k = 0;

    const b = bs[i];
    if (!r.scored) return `<div class="pt c-${b.cat} na" style="--dl:${(k++) * .12}s"><span class="n">${b.n}</span><span class="fr">${esc(b.seg)} <span class="en2">no French word needed</span></span><span class="stt" style="background:var(--surface);color:var(--muted)">—</span></div>`;
    const cl = r.final >= 0.99 ? 'ok' : r.final > 0 ? 'part' : 'no';
    let lab = r.s === 0 ? 'Missing' : (r.s >= 1 && !r.cost ? 'Correct' : 'Part mark');

    const kd = KIND[r.kind] || KIND.none;
    let why = '';
    if (r.s === 0) why = `Expected <b>${esc(b.frs[0])}</b>`;
    else {
      if (kd[1]) why += kd[1] + '. ';
      if (r.s < 1 && r.said) why += `You wrote “${esc(r.said)}”; the model has <b>${esc(b.frs[0])}</b>. `;
      if (r.cost) why += `Vocab hint −${fmt(r.cost)}. `;
      if (!why) why = `Matched <b>${esc(b.frs[0])}</b>`;
    }
    return `<div class="pt c-${b.cat} ${cl}" style="--dl:${(k++) * .12}s"><span class="n">${b.n}</span><span class="fr">${esc(b.seg)} <span class="en2">→ ${esc(b.frs[0])}</span></span><span class="stt">${lab} ${fmt(r.final)}/1</span><span class="why">${why}</span></div>`;
  }).join('');
}

function viewPlay() {
  const r = st.run, p = r.p, si = r.si, s = p.sentences[si], A = r.ans[si], bs = bubblesOf(p, s), locked = !!A.res;
  const done = r.ans.filter(a => a.fin);
  const tot = done.reduce((x, a) => x + a.fin.total, 0), mx = done.reduce((x, a) => x + a.fin.max, 0);
  const dots = p.sentences.map((x, i) => {
    const a = r.ans[i]; let cl = '';
    if (a.fin) { const f = a.fin.max ? a.fin.total / a.fin.max : 0; cl = f >= .85 ? 'full' : f >= .4 ? 'part' : 'low'; }
    const can = !!a.fin || i === si;
    return `<button class="dot ${cl}" data-act="goto" data-i="${i}" ${i === si ? 'aria-current="true"' : ''} ${can ? '' : 'disabled'} aria-label="Sentence ${i + 1}">${i + 1}</button>`;
  }).join('');

      const u = A.usage[b.i] || 0;
      return `<div class="chunk c-${b.cat}"><div class="top2"><span class="n">${b.n}</span><span class="segen">${esc(b.seg)}</span><span class="lab">${CAT[b.cat].n}</span><button class="hb" data-act="bub" data-b="${b.i}" aria-expanded="${!!A.open[b.i]}">${A.open[b.i] ? 'Hide hint' : 'Hint'}</button></div>

    }).join('')}</div>${locked ? '' : accBar()}`;

      <div class="tiles">${A.tl.tiles.map((t, k) => `<button class="tile ${used.includes(k) ? 'used' : ''}" data-act="tile" data-k="${k}" ${locked ? 'disabled' : ''}>${esc(t.w)}</button>`).join('')}</div>`;

  return `<div class="playhead"><h2>${esc(p.name)} <small>${MODELS[st.model].n} · ${STYLES[st.style][0]} marking</small></h2><span class="score" id="sc">${mx ? fmt(tot) + ' / ' + mx + ' so far' : 'No points yet'}</span></div>
  <div class="dots" role="group" aria-label="Sentences">${dots}</div>
  ${st.quit ? `<div class="quit"><b>Leave this text? Your progress will be lost.</b><button class="btn ghost" data-act="quit-no">Keep going</button><button class="btn" data-act="home">Leave</button></div>` : ''}
  <div class="card"><div class="en">${s.label === 'Title' ? '<span class="tag">Title</span>' : ''}${sentHTML(p, s)}</div>
    ${hintsBlock}${input}${checkBtn}${res}</div>

}
function bubbleVh(b, A, locked) {
  if (!b.frs.length) return '';
  const u = A.usage[b.i] || 0, c = hintCost();
  const lab1 = st.cost === 'free' ? '' : ` (−${fmt(c[0])})`, lab2 = st.cost === 'free' ? '' : ` (−${fmt(c[1])} in all)`;
  return `<div class="vh">${u === 0 ? `<button class="vbtn" data-act="vh" data-b="${b.i}" data-l="1" ${locked ? 'disabled' : ''}>First letters${lab1}</button>` : ''}
    ${u < 2 ? `<button class="vbtn" data-act="vh" data-b="${b.i}" data-l="2" ${locked ? 'disabled' : ''}>Show the French${lab2}</button>` : ''}
    ${u === 1 ? `<span class="vshow pat">${esc(pattern(b.frs[0]))}</span>` : ''}${u === 2 ? `<span class="vshow">${esc(b.frs[0])}</span>` : ''}</div>`;

/* ---------------- summary ---------------- */
function summaryData() {
  const r = st.run, p = r.p;
  let total = 0, max = 0, lost = 0, used = 0, perfect = 0;
  const cat = {}; Object.keys(CAT).forEach(k => cat[k] = { s: 0, t: 0 });
  r.ans.forEach((a, i) => {
    if (!a.fin) return;
    total += a.fin.total; max += a.fin.max; lost += a.fin.lost;
    if (a.fin.max && a.fin.total >= a.fin.max - 1e-9) perfect++;
    const bs = bubblesOf(p, p.sentences[i]);
    a.res.forEach((x, j) => { if (!x.scored) return; cat[bs[j].cat].s += x.final; cat[bs[j].cat].t += 1; if (a.usage[bs[j].i]) used++; });
  });
  const pct = max ? Math.round(100 * total / max) : 0;
  const exam = p.marks ? Math.round(2 * p.marks * total / (max || 1)) / 2 : null;
  return { total, max, lost, used, perfect, cat, pct, exam };
}
function yourAnswer(a, p, s) {
  if (st.model === 'type') return a.text.trim();
  if (st.model === 'tiles') return a.input || '';
  return bubblesOf(p, s).filter(b => b.frs.length).map(b => (a.chunks[b.i] || '').trim() || '…').join(' | ');
}
function resultText(sd) {
  const p = st.run.p;
  return [`Learn French with Haresh Sir · Traduisez !`, `Name: ${st.name || 'Student'}`, `Text ${p.id}: ${p.name} (${p.gloss})`,
    `Model: ${MODELS[st.model].n} · ${STYLES[st.style][0]} marking`,
    `Score: ${sd.exam !== null ? sd.exam + ' / ' + p.marks + ' marks · ' : ''}${fmt(sd.total)} / ${sd.max} points (${sd.pct}%)`,
    `Perfect sentences: ${sd.perfect} of ${p.sentences.length}`, `Vocab hints used: ${sd.used}${sd.lost ? ' (−' + fmt(sd.lost) + ' points)' : ''}`].join('\n');
}
function viewSummary() {
  const r = st.run, p = r.p, sd = summaryData();

  const head = sd.pct >= 90 ? 'Magnifique' : sd.pct >= 70 ? 'Très bien' : sd.pct >= 40 ? 'Bien joué' : 'Courage';
  const bars = Object.keys(CAT).filter(k => sd.cat[k].t).map(k => { const v = sd.cat[k], pc = Math.round(100 * v.s / v.t); return `<div class="br c-${k}"><span>${CAT[k].n}</span><span class="tr"><span class="fl" data-w="${pc}"></span></span><span>${fmt(v.s)}/${v.t}</span></div>`; }).join('');
  const ranked = Object.keys(CAT).filter(k => sd.cat[k].t >= 2).map(k => [k, sd.cat[k].s / sd.cat[k].t]).sort((a, b) => b[1] - a[1]);
  const strong = ranked[0], weak = ranked[ranked.length - 1];
  const advice = ranked.length > 1 && strong[1] > weak[1] ? `Your strongest area was <b>${CAT[strong[0]].n.toLowerCase()}</b>. Next time, practise <b>${CAT[weak[0]].n.toLowerCase()}</b>: ${CAT[weak[0]].d.toLowerCase()}` : 'Nice and even across the six strategies.';
  const review = p.sentences.map((s, i) => {
    const a = r.ans[i], bs = bubblesOf(p, s);
    const f = a.fin && a.fin.max ? a.fin.total / a.fin.max : 0, cl = !a.fin ? 'skip' : f >= .85 ? 'full' : f >= .4 ? 'part' : 'low';
    const chips = a.res ? a.res.map((x, j) => x.scored ? `<span class="chip c-${bs[j].cat} ${x.final < .5 ? 'bad' : ''}" title="${esc(bs[j].seg)}">${bs[j].n} ${esc(bs[j].frs[0])} · ${fmt(x.final)}</span>` : '').join('') : '';
    return `<details class="rev"><summary><span class="k ${cl}">${i + 1}</span><span class="e">${esc(s.en)}</span><span class="p">${a.fin ? fmt(a.fin.total) + '/' + a.fin.max : '—'}</span></summary><div class="in">
      <span class="lbl">Your answer</span><div class="yw">${esc(yourAnswer(a, p, s)) || '<i>nothing written</i>'}</div>
      <span class="lbl">Model translation</span><div class="km">${esc(s.fr)}</div>
      ${s.note ? `<div class="hint-note">${esc(s.note)}</div>` : ''}<div class="chips">${chips}</div></div></details>`;
  }).join('');
  const full = p.sentences.map(s => s.fr).join(' ');
  const keyRows = p.sentences.map((s, i) => `<tr><td>${s.label === 'Title' ? 'Title' : i + 1}</td><td>${esc(s.en)}</td><td class="fr">${esc(s.fr)}</td><td>${esc(s.note)}</td></tr>`).join('');
  const by = {};
  p.bubbles.forEach(b => { (by[b.strat] = by[b.strat] || []).push(b); });
  const smap = DATA.strats.filter(x => by[x.id]).map(x => {
    const bl = by[x.id];
    return `<div class="sr2 c-${x.cat}"><b>${esc(x.name)}</b><span class="ex">${bl.slice(0, 6).map(b => esc(b.seg) + ' → ' + esc(b.fr === '-' ? '(no word)' : b.fr)).join(' · ')}</span><span class="nn">Bubbles ${bl.map(b => b.n).join(', ')}</span></div>`;
  }).join('');
  const text = resultText(sd);
  return `<section class="sum-hero"><div><h1>${head}${st.name ? ', ' + esc(st.name) : ''} !</h1><p>${esc(p.name)} · ${MODELS[st.model].n}</p>
      <div class="stars" aria-label="${stars} of 3 stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div></div>
    <div class="bigscore"><b>${sd.exam !== null ? sd.exam + '/' + p.marks : sd.pct + '%'}</b><span>${sd.exam !== null ? 'exam marks · ' + sd.pct + '%' : fmt(sd.total) + ' of ' + sd.max + ' points'}</span></div></section>
  <div class="stats"><div class="stat"><b>${fmt(sd.total)}/${sd.max}</b><span>points earned</span></div><div class="stat"><b>${sd.perfect}/${p.sentences.length}</b><span>perfect sentences</span></div>
    <div class="stat"><b>${sd.used}</b><span>vocab hints used</span></div><div class="stat"><b>−${fmt(sd.lost)}</b><span>points lost to hints</span></div></div>
  <section class="sec"><h2>Your strategies</h2><div class="bars">${bars}</div><p class="hint-note">${advice}</p></section>
  <section class="sec"><h2>What you wrote</h2><p class="hint-note">Open a sentence to compare your answer with the model.</p>${review}</section>
  <section class="sec key"><h2>Answer key</h2><span class="lbl hint-note">Model translation of the whole text</span><p class="full">${esc(full)}</p>
    <div class="tbl"><table><thead><tr><th>No.</th><th>English</th><th>Model French</th><th>Marking notes</th></tr></thead><tbody>${keyRows}</tbody></table></div></section>
  <details class="sec"><summary style="cursor:pointer;font-family:var(--f-head);font-weight:600;font-size:22px">How the strategies apply to this text</summary><div class="smap" style="margin-top:12px">${smap}</div></details>
  <section class="sec"><h2>Share your result</h2><div class="share"><button class="btn ghost" data-act="copy">Copy my results</button>
    <a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text)}">Send on WhatsApp</a></div><div id="copyslot"></div></section>
  <div class="row"><button class="btn big" data-act="again">Try this text again</button><button class="btn ghost big" data-act="home">Choose another text</button></div>`;
}

/* ---------------- render ---------------- */
function render() {
  const app = $('#app');
  const scroll = window.scrollY;
  const body = st.view === 'home' ? viewHome() : st.view === 'read' ? viewRead() : st.view === 'play' ? viewPlay() : viewSummary();
  app.innerHTML = TOP() + '<div class="app">' + body + '</div>';
  if (st.view === 'read') startTimer();
  if (st.view === 'summary') requestAnimationFrame(() => document.querySelectorAll('.fl').forEach(e => e.style.width = e.dataset.w + '%'));
  return scroll;
}
function renderKeep() { const y = window.scrollY; const f = document.activeElement; const id = f && f.id; const ci = f && f.dataset && f.dataset.ci; render(); window.scrollTo(0, y); if (id) { const e = document.getElementById(id); if (e) e.focus(); } else if (ci) { const e = document.querySelector('[data-ci="' + ci + '"]'); if (e) e.focus(); } }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* reading timer */
function startTimer() {
  clearInterval(st.timer);
  const total = st.run.readSecs, t0 = Date.now();
  const btn = $('#beginbtn'), tt = $('#tt'), fg = $('#ringfg'), msg = $('#tmsg');
  const circ = 364.4;
  const tick = () => {
    const left = Math.max(0, total - Math.floor((Date.now() - t0) / 1000));
    tt.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    fg.style.strokeDashoffset = String(circ * (1 - left / total));
    if (left <= 0) { clearInterval(st.timer); btn.disabled = false; msg.textContent = 'Time is up. Ready?'; Snd.chime(); btn.focus(); }
  };
  tick(); st.timer = setInterval(tick, 500);
}

/* checking */
function doCheck() {
  const r = st.run, p = r.p, s = p.sentences[r.si], A = r.ans[r.si], bs = bubblesOf(p, s);
  let input;
  if (st.model === 'type') { input = A.text; if (!input.trim()) return toast('Write your sentence first.'); }
  else if (st.model === 'chunk') { input = bs.map(b => A.chunks[b.i] || ''); if (!input.some(x => x.trim())) return toast('Fill in at least one box.'); }
  else { if (!A.tiles.length) return toast('Tap some words first.'); input = A.tiles.map(k => A.tl.tiles[k].w).join(' ') + (A.tl.end || ''); A.input = input; }
  Snd.init();
  const usage = bs.map(b => A.usage[b.i] || 0);
  A.res = Engine.scoreSentence({ fr: s.fr, alts: s.alts }, bs, input, st.style);
  A.fin = Engine.finalise(A.res, usage, st.cost);
  if (st.model === 'tiles') A.exact = Engine.na(input.toLowerCase()).replace(/[^a-z0-9]/g, '') === Engine.na(s.fr.toLowerCase()).replace(/[^a-z0-9]/g, '');
  render();
  const y = document.getElementById('rows'); if (y) y.scrollIntoView({ behavior: 'smooth', block: 'center' });
  // sounds, one per scored point, then a verdict
  let k = 0, rise = 0;
  A.res.forEach(x => {
    if (!x.scored) return;
    const at = k++ * 120;
    setTimeout(() => { if (x.final >= .99) Snd.good(rise++); else if (x.final > 0) Snd.almost(); else Snd.bad(); }, at);
  });
  const f = A.fin.max ? A.fin.total / A.fin.max : 0;
  setTimeout(() => { if (f >= .99) Snd.fanfare(); else if (f < .3) Snd.sad(); }, k * 120 + 150);
}
function finish() {
  st.view = 'summary'; st.run.done = true;
  const sd = summaryData();
  if (!st.best[st.run.p.id] || st.best[st.run.p.id] < sd.pct) { st.best[st.run.p.id] = sd.pct; store.set('best', st.best); }
  render(); window.scrollTo(0, 0);
  Snd.init();
  if (sd.pct >= 70) { Snd.fanfare(); confetti(); } else if (sd.pct >= 40) Snd.chime(); else Snd.sad();
}
function confetti() {
